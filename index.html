<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>土日計画</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:#F7F6F2;color:#1A1916;font-size:15px}
.app{max-width:480px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:18px;font-weight:500}
.sub{font-size:12px;color:#7A7870;margin-top:2px;margin-bottom:20px}
.daysec{margin-bottom:28px}
.daytitle{font-size:16px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.totalbar{display:flex;justify-content:space-between;padding:7px 10px;border-radius:8px;background:#EFEDE5;font-size:12px;color:#7A7870;margin-bottom:10px}
.totalbar strong{font-family:'DM Mono',monospace;color:#1A1916}
.ambadge{display:inline-block;font-size:11px;font-weight:600;color:#085041;background:#E1F5EE;padding:3px 9px;border-radius:99px;margin-bottom:8px}
.pmsep{display:flex;align-items:center;gap:8px;margin:12px 0 8px}
.pmsep .line{flex:1;height:1px;background:#E4E2DA}
.pmsep span{font-size:11px;color:#7A7870;white-space:nowrap}
.card{background:#fff;border:1px solid #E4E2DA;border-radius:10px;padding:9px 10px;margin-bottom:6px}
.card.am{border-left:3px solid #1D9E75;background:#F4FBF8}
.card.nested{border-left:3px solid #EF9F27}
.top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.nameinp{flex:1;min-width:0;font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;border:1px solid transparent;border-radius:5px;padding:3px 5px;background:transparent;color:#1A1916}
.nameinp:focus{outline:none;border-color:#1D9E75;background:#fff}
.dur{font-size:11px;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:99px;background:#F0EEE6;color:#7A7870;white-space:nowrap;flex-shrink:0}
.acts{display:flex;gap:4px;flex-shrink:0}
.abtn{background:none;border:1px solid #E4E2DA;border-radius:5px;cursor:pointer;font-size:11px;padding:3px 7px;font-family:'DM Sans',sans-serif;color:#7A7870;display:flex;align-items:center;gap:3px;white-space:nowrap}
.abtn:active{background:#F7F6F2}
.abtn.del{color:#A32D2D;border-color:#F0B6B6}
.times{display:flex;align-items:center;gap:6px}
.tinp{width:62px;font-size:13px;font-family:'DM Mono',monospace;border:1px solid #E4E2DA;border-radius:6px;padding:5px 6px;background:#fff;color:#1A1916;text-align:center}
.tinp:focus{outline:none;border-color:#1D9E75}
.tsep{font-size:11px;color:#7A7870}
.addrow{display:flex;gap:6px;margin-top:8px}
.addinp{flex:1;min-width:0;font-size:13px;font-family:'DM Sans',sans-serif;border:1px solid #E4E2DA;border-radius:9px;padding:8px 10px;background:#fff;color:#1A1916}
.addinp:focus{outline:none;border-color:#1D9E75}
.addbtn{padding:8px 13px;font-size:13px;font-family:'DM Sans',sans-serif;border:1px solid #5DCAA5;border-radius:9px;background:#E1F5EE;color:#085041;cursor:pointer;white-space:nowrap}
.resetbtn{width:100%;padding:10px;background:none;color:#7A7870;border:1px solid #E4E2DA;border-radius:10px;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:8px}
.empty{font-size:12px;color:#7A7870;padding:6px 0}
</style>
</head>
<body>
<div class="app">
  <h1>土日計画</h1>
  <p class="sub">午前はボーナスタイム ⭐️　時間は 630 / 1430 のように入力</p>
  <div id="root"></div>
  <button class="resetbtn" id="reset">デフォルトに戻す</button>
</div>

<script>
function defaults(){
  var base=[
    {name:'散歩・カフェ移動',s:'06:30',e:'07:00'},
    {name:'英語',s:'07:00',e:'08:00'},
    {name:'ケース問題',s:'08:00',e:'09:00'},
    {name:'読書・楽天マガジン・図書館',s:'09:00',e:'11:00'},
    {name:'エニタイム',s:'11:00',e:'12:00'},
    {name:'床',s:'17:00',e:'17:30'},
    {name:'Youtubeとガイカワサキ',s:'17:30',e:'18:00'},
    {name:'AI',s:'18:00',e:'19:00'}
  ];
  return {
    sat:base.map(function(x){return {name:x.name,s:x.s,e:x.e};}),
    sun:base.map(function(x){return {name:x.name,s:x.s,e:x.e};})
  };
}
var DAYS=[{key:'sat',label:'土曜日',icon:'ti-sun'},{key:'sun',label:'日曜日',icon:'ti-moon'}];

function load(){
  try{var v=localStorage.getItem('wd_plan_v1');if(v)return JSON.parse(v);}catch(e){}
  return defaults();
}
function save(){try{localStorage.setItem('wd_plan_v1',JSON.stringify(data));}catch(e){}}
var data=load();

function toMin(t){
  if(!t)return null;
  var p=t.split(':');if(p.length<2)return null;
  var h=parseInt(p[0]),m=parseInt(p[1]);
  if(isNaN(h)||isNaN(m))return null;
  return h*60+m;
}
function normalize(v){
  v=String(v).replace(/[^\d]/g,'');
  if(v.length===0)return '';
  if(v.length===1)return '0'+v+':00';
  if(v.length===2)return v+':00';
  if(v.length===3)return '0'+v[0]+':'+v.slice(1);
  if(v.length===4)return v.slice(0,2)+':'+v.slice(2);
  return v.slice(0,2)+':'+v.slice(2,4);
}
function dur(a,b){var x=toMin(a),y=toMin(b);if(x===null||y===null||y<=x)return null;return y-x;}
function sortDay(k){
  data[k].sort(function(a,b){
    var x=toMin(a.s),y=toMin(b.s);
    if(x===null&&y===null)return 0;
    if(x===null)return 1;
    if(y===null)return -1;
    if(x!==y)return x-y;
    var ax=toMin(a.e),by=toMin(b.e);
    return (by||0)-(ax||0);
  });
}
function depths(items){
  var out=[];
  for(var i=0;i<items.length;i++){
    var s=toMin(items[i].s),e=toMin(items[i].e),d=0;
    for(var j=0;j<i;j++){
      var ps=toMin(items[j].s),pe=toMin(items[j].e);
      if(ps!==null&&pe!==null&&s!==null&&e!==null&&s>=ps&&e<=pe){
        d=Math.max(d,out[j]+1);
      }
    }
    out.push(d);
  }
  return out;
}

function render(){
  var root=document.getElementById('root');
  root.innerHTML='';
  DAYS.forEach(function(D){
    var k=D.key;
    var sec=document.createElement('div');
    sec.className='daysec';

    var title=document.createElement('div');
    title.className='daytitle';
    title.innerHTML='<i class="ti '+D.icon+'" aria-hidden="true"></i>'+D.label;
    sec.appendChild(title);

    var total=0;
    data[k].forEach(function(it){var d=dur(it.s,it.e);if(d)total+=d;});
    var tb=document.createElement('div');
    tb.className='totalbar';
    var h=Math.floor(total/60),m=total%60;
    tb.innerHTML='<span>予定合計</span><strong>'+(h>0?h+'時間':'')+(m>0?m+'分':(h>0?'':'0分'))+'</strong>';
    sec.appendChild(tb);

    var ds=depths(data[k]);
    var prevAM=null;

    if(data[k].length===0){
      var em=document.createElement('p');
      em.className='empty';
      em.textContent='まだ予定がありません';
      sec.appendChild(em);
    }

    data[k].forEach(function(it,i){
      var sm=toMin(it.s);
      var am=sm!==null&&sm<720;
      if(prevAM===null&&am){
        var bd=document.createElement('div');
        bd.className='ambadge';
        bd.textContent='⭐ ボーナスタイム（午前）';
        sec.appendChild(bd);
      }
      if(prevAM===true&&!am){
        var sp=document.createElement('div');
        sp.className='pmsep';
        sp.innerHTML='<div class="line"></div><span>午後〜</span><div class="line"></div>';
        sec.appendChild(sp);
      }
      prevAM=am;

      var wrap=document.createElement('div');
      wrap.style.paddingLeft=(ds[i]*18)+'px';

      var card=document.createElement('div');
      card.className='card'+(am?' am':'')+(ds[i]>0?' nested':'');

      var top=document.createElement('div');
      top.className='top';

      var nin=document.createElement('input');
      nin.className='nameinp';
      nin.type='text';
      nin.value=it.name;
      nin.setAttribute('aria-label','予定名');
      nin.addEventListener('blur',(function(kk,ii){return function(){
        data[kk][ii].name=this.value;save();
      };})(k,i));
      top.appendChild(nin);

      var d=dur(it.s,it.e);
      if(d){
        var db=document.createElement('span');
        db.className='dur';
        db.textContent=d+'分';
        top.appendChild(db);
      }

      var acts=document.createElement('div');
      acts.className='acts';
      var cb=document.createElement('button');
      cb.className='abtn';
      cb.innerHTML='<i class="ti ti-copy" aria-hidden="true"></i>複製';
      cb.addEventListener('click',(function(kk,ii){return function(){
        var o=data[kk][ii];
        data[kk].splice(ii+1,0,{name:o.name,s:o.s,e:o.e});
        save();render();
      };})(k,i));
      var rb=document.createElement('button');
      rb.className='abtn del';
      rb.innerHTML='<i class="ti ti-trash" aria-hidden="true"></i>削除';
      rb.addEventListener('click',(function(kk,ii){return function(){
        data[kk].splice(ii,1);save();render();
      };})(k,i));
      acts.appendChild(cb);acts.appendChild(rb);
      top.appendChild(acts);
      card.appendChild(top);

      var times=document.createElement('div');
      times.className='times';
      var si=document.createElement('input');
      si.className='tinp';si.type='text';si.inputMode='numeric';si.placeholder='0900';si.value=it.s||'';
      si.setAttribute('aria-label','開始時刻');
      si.addEventListener('focus',function(){this.select();});
      si.addEventListener('click',function(){this.select();});
      si.addEventListener('blur',(function(kk,ii){return function(){
        data[kk][ii].s=this.value.trim()===''?'':normalize(this.value);
        sortDay(kk);save();render();
      };})(k,i));
      var sep=document.createElement('span');sep.className='tsep';sep.textContent='〜';
      var ei=document.createElement('input');
      ei.className='tinp';ei.type='text';ei.inputMode='numeric';ei.placeholder='1000';ei.value=it.e||'';
      ei.setAttribute('aria-label','終了時刻');
      ei.addEventListener('focus',function(){this.select();});
      ei.addEventListener('click',function(){this.select();});
      ei.addEventListener('blur',(function(kk,ii){return function(){
        data[kk][ii].e=this.value.trim()===''?'':normalize(this.value);
        sortDay(kk);save();render();
      };})(k,i));
      times.appendChild(si);times.appendChild(sep);times.appendChild(ei);
      card.appendChild(times);

      wrap.appendChild(card);
      sec.appendChild(wrap);
    });

    var ar=document.createElement('div');
    ar.className='addrow';
    var ai=document.createElement('input');
    ai.className='addinp';ai.type='text';ai.placeholder='予定を追加';
    ai.setAttribute('aria-label',D.label+'に予定を追加');
    var ab=document.createElement('button');
    ab.className='addbtn';
    ab.innerHTML='<i class="ti ti-plus" aria-hidden="true"></i> 追加';
    function doAdd(){
      var v=ai.value.trim();if(!v)return;
      data[k].push({name:v,s:'',e:''});
      sortDay(k);save();render();
    }
    ab.addEventListener('click',doAdd);
    ai.addEventListener('keydown',function(ev){if(ev.key==='Enter')doAdd();});
    ar.appendChild(ai);ar.appendChild(ab);
    sec.appendChild(ar);

    root.appendChild(sec);
  });
}

document.getElementById('reset').addEventListener('click',function(){
  if(!confirm('デフォルトのスケジュールに戻しますか？'))return;
  data=defaults();save();render();
});

render();
</script>
</body>
</html>
